name: tests

# push と pull request のたびに、PowerPoint を使わない部分のテストを走らせる
on:
  push:
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: 日本語フォントを入れる（Ubuntu）
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk fonts-liberation
      - name: 依存を入れる
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: テスト
        env:
          PYTHONUTF8: "1"
        run: python -m pytest -q
